    <script>
      // Suppress benign sandbox WebSocket / HMR disconnect errors in iframe preview
      (function () {
        var origConsoleError = console.error;
        console.error = function () {
          var firstArg = arguments[0];
          if (typeof firstArg === 'string' && (firstArg.includes('[vite]') || firstArg.includes('websocket') || firstArg.includes('WebSocket'))) {
            return;
          }
          origConsoleError.apply(console, arguments);
        };
        var origConsoleDebug = console.debug;
        console.debug = function () {
          var firstArg = arguments[0];
          if (typeof firstArg === 'string' && firstArg.includes('[vite]')) {
            return;
          }
          origConsoleDebug.apply(console, arguments);
        };
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          var msg = (reason && (reason.message || (typeof reason === 'string' ? reason : String(reason)))) || '';
          if (msg.includes('WebSocket') || msg.includes('websocket')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function (event) {
          var msg = (event && (event.message || String(event))) || '';
          if (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('[vite]')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>

    <style>
      .splash-transition,
      #first-paint-splash {
        transition: opacity 500ms ease-out, visibility 500ms ease-out;
        opacity: 1;
        visibility: visible;
      }
      .splash-transition.splash-fade-out,
      #first-paint-splash.splash-fade-out {
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-transition,
        #first-paint-splash {
          transition: none !important;
        }
      }

  <body style="margin: 0; background-color: #FAF7F2;">
    <!-- First-Frame Session-Aware FormatAI Splash Screen (Only on first entry in session, never on refresh) -->
    <div id="first-paint-splash" class="splash-transition" style="display: none; position: fixed; inset: 0; z-index: 99999; background-color: #FAF7F2; flex-direction: column; align-items: center; justify-content: center; font-family: 'Playfair Display', Georgia, serif; user-select: none;">
      <div style="display: flex; flex-direction: column; align-items: center; text-align: center; max-width: 420px; padding: 16px;">
        <img src="/format-ai-icon-transparent.png" alt="FormatAI Logo" width="84" height="84" style="width: 84px; height: 84px; object-fit: contain; margin-bottom: 14px;" />
        <div style="display: flex; align-items: baseline; font-size: 36px; font-weight: 900; line-height: 1; letter-spacing: -0.02em; margin-bottom: 24px;">
          <span style="color: #23150D;">Format</span>
          <span style="color: #C45525; margin-left: 2px;">AI</span>
        </div>
        <p style="margin: 0; font-size: 18px; font-weight: 600; color: #8C3D18; letter-spacing: -0.01em;">
          Paste. Format. Get Documents.
        </p>
      </div>
    </div>
    <script>
      (function() {
        try {
          var isReload = false;
          var navEntries = (window.performance && performance.getEntriesByType) ? performance.getEntriesByType('navigation') : null;
          if (navEntries && navEntries.length > 0) {
            isReload = navEntries[0].type === 'reload';
          } else if (window.performance && window.performance.navigation) {
            isReload = window.performance.navigation.type === 1;
          }

          var isInitialized = sessionStorage.getItem('formatai_session_initialized') === 'true';

          // Show splash ONLY on first entry in session, NEVER on reload/refresh
          if (!isReload && !isInitialized) {
            var splashEl = document.getElementById('first-paint-splash');
            if (splashEl) {
              splashEl.style.display = 'flex';
            }
          }
        } catch (e) {
          // Fallback safe
        }

        // Global helper for smooth class-based fade out handoff
        window.hideFirstPaintSplash = function(immediate) {
          // Immediately set the session initialization flag upon app ready
          try {
            sessionStorage.setItem('formatai_session_initialized', 'true');
          } catch (e) {
            // Fallback safe
          }

          var el = document.getElementById('first-paint-splash');
          if (!el) {
            return;
          }

          if (immediate) {
            el.remove();
            return;
          }

          // Force browser layout reflow so the initial opacity is computed before transitioning
          void el.offsetHeight;

          // Apply class-based transition to trigger opacity and visibility change
          el.classList.add('splash-fade-out');

          var isRemoved = false;
          var cleanup = function() {
            if (isRemoved) return;
            isRemoved = true;
            if (el && el.parentNode) {
              el.remove();
            }
          };

          el.addEventListener('transitionend', function(e) {
            if (e.target === el) {
              cleanup();
            }
          }, { once: true });

          // Fallback timeout in case transitionend does not trigger or is cancelled
          setTimeout(cleanup, 550);
        };

        // Safety fallback: if app ready is delayed, gracefully fade out splash
        window.addEventListener('load', function() {
          setTimeout(function() {
            var el = document.getElementById('first-paint-splash');
            if (el && !el.classList.contains('splash-fade-out')) {
              window.hideFirstPaintSplash(false);
            }
          }, 3500);
        });
      })();
    </script>
