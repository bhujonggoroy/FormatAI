<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NotebookLM to DOCX Converter — FormatAI</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <script>
      // Suppress benign sandbox WebSocket / HMR disconnect errors in iframe preview
      window.addEventListener('unhandledrejection', function (event) {
        var reason = event.reason;
        var msg = (reason && (reason.message || (typeof reason === 'string' ? reason : ''))) || '';
        if (msg.includes('WebSocket') || msg.includes('websocket')) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function (event) {
        var msg = (event && event.message) || '';
        if (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('[vite] failed to connect')) {
          event.preventDefault();
        }
      });
    </script>
    <meta name="description" content="FormatAI — Paste. Format. Get Documents. Clean up raw notes, math expressions, and LaTeX from NotebookLM, ChatGPT, Gemini, Claude, and convert them into publication-ready Word (.docx) documents." />
    <meta property="og:title" content="FormatAI — Paste. Format. Get Documents." />
    <meta property="og:description" content="Turn AI-generated notes, LaTeX equations, and raw text into clean, publication-ready DOCX documents." />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/logo.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
